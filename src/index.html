<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; object-src 'none'"><title>Astra Browser Electron</title><link rel="stylesheet" href="style.css"></head><body><aside><div class="drag"></div><button id="new">＋ New tab</button><div id="tabs"></div><footer><button id="settings">⚙ Settings</button></footer></aside><header><button id="tabs-toggle" title="Show or hide tabs" aria-expanded="true">☰</button><button id="back">‹</button><button id="forward">›</button><button id="reload">↻</button><form id="location"><input id="address" placeholder="Search or enter address"></form><button id="media-download" title="Download media">↓</button><button id="downloads-toggle" title="Show or hide downloads" aria-expanded="false">Downloads</button><button id="ai-toggle" title="Toggle AI sidebar" aria-expanded="true">✦ AI</button><span class="brand">✦ Astra</span></header><main><section id="preferences" hidden><h1>Settings</h1><h2>Network proxy</h2><select id="proxy-mode"><option value="system">Automatic — follow macOS proxy settings</option><option value="manual">Manual proxy</option><option value="direct">Direct connection</option></select><p><input id="proxy-address" placeholder="http://127.0.0.1:7890"></p><button id="proxy-save">Apply proxy</button><button id="proxy-discover">Detect current proxy</button><p id="proxy-status" role="status"></p><button id="dictionary">Dictionary</button><div id="words"></div><h2>ZenMux AI</h2><input id="api-key" type="password" placeholder="ZenMux API key" autocomplete="off"><button id="save-key">Save API key</button><button id="test-key">Test API key</button><button id="zenmux-register">Get a ZenMux API key</button><p id="credential-status" role="status"></p><p>Interface and website language</p><select id="language"><option value="system">System default</option><option value="en">English</option><option value="zh-CN">zh-CN</option><option value="zh-TW">zh-TW</option><option value="ja">ja</option><option value="ko">ko</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option><option value="nl">Nederlands</option></select><p><label><input type="checkbox" id="dnt"> Do Not Track</label></p><button id="save">Save settings</button><p>Reload a website to apply its new language. Website account settings may override browser preferences.</p></section></main><div id="download-shelf" hidden><strong>Downloads</strong><button id="downloads-hide" aria-label="Hide downloads" title="Hide downloads">×</button><div id="downloads"></div></div><section id="ai-panel"><h2>✦ Astra AI</h2><button id="copy-conversation">Copy conversation</button><button id="summarize-video">Summarize video · 8 sampled frames</button><p><input id="model" placeholder="Provider/model ID"><button id="save-model">Save model</button><button id="test-model">Test model</button></p><div id="conversation" aria-live="polite"></div><button id="copy-prompt">Copy prompt</button><button id="capture-page">Attach webpage screenshot</button><div id="attachments"></div><label class="attach-label">＋ Attach files<input id="file-input" type="file" accept="image/png,image/jpeg,image/webp,text/plain,text/markdown,.txt,.md" multiple hidden></label><textarea id="prompt" placeholder="Ask Astra" rows="4"></textarea><p><label><input id="include-page" type="checkbox"> Include current page text</label></p><p><label><input id="browser-control" type="checkbox"> Browser control · huashu</label></p><button id="agent-confirm-completed" hidden>I confirm the task is complete</button><button id="agent-continue" hidden>Continue execution</button><button id="agent-stop">Stop browser control</button><p id="task-observer" role="status">Completion observer: idle</p><details><summary>Browser actions</summary><ol id="agent-trace"></ol></details><button id="ask">Send</button><p id="ai-status" role="s
